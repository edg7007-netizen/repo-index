services:
  ollama:
    image: ollama/ollama:latest
    container_name: repo-index-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  repo-index:
    build: .
    container_name: repo-index-app
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: codellama:13b
    volumes:
      - ${REPOS_PATH:-./repos}:/repos:ro
    depends_on:
      - ollama

volumes:
  ollama-data:
